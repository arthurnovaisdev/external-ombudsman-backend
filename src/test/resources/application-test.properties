spring.datasource.url=jdbc:h2:mem:employee_reporting_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# As migrations de produção contêm sintaxe específica do PostgreSQL.
# No teste de contexto, o Hibernate valida os mapeamentos em um banco isolado.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=test-only-secret-key-with-at-least-32-bytes
jwt.expiration-ms=3600000

brevo.api.key=test-only-key
brevo.sender.email=no-reply@example.test
app.frontend.base-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173

attachments.enabled=false
supabase.keep-alive.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
