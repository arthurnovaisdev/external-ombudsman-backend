spring.application.name=external-ombudsman
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}

# Brevo
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Ouvidoria MBFREIRE

# Admin Notifications
notifications.admin.enabled=${ADMIN_NOTIFICATIONS_ENABLED:false}
notifications.admin.email=${ADMIN_NOTIFICATION_EMAIL:}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=26MB
attachments.enabled=${ATTACHMENTS_ENABLED:false}

# Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:}
supabase.keep-alive.enabled=${SUPABASE_KEEP_ALIVE_ENABLED:false}

# Report Message Retention
reports.retention.enabled=${REPORT_RETENTION_ENABLED:true}
reports.retention.retention-days=${REPORT_RETENTION_DAYS:180}
reports.retention.batch-size=${REPORT_RETENTION_BATCH_SIZE:100}
reports.retention.cron=${REPORT_RETENTION_CRON:0 0 3 * * *}
